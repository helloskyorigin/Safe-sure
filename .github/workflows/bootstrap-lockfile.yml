name: Bootstrap reproducible npm lockfile
on:
  push:
    branches: [infra/reproducible-deps-20261028]
    paths: [.github/workflows/bootstrap-lockfile.yml]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate npm lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify clean dependency install
        run: npm ci --no-audit --no-fund
      - name: Commit lockfile to isolated branch
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && exit 0
          git commit -m "chore: lock exact npm dependencies for reproducible installs"
          git push origin HEAD:refs/heads/infra/reproducible-deps-20261028
