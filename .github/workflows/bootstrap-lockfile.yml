name: Refresh patched npm lockfile
on:
  push:
    branches: [infra/reproducible-deps-20261028]
    paths: [.github/workflows/bootstrap-lockfile.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate patched lockfile
        run: npm install --package-lock-only --no-audit --no-fund
      - name: Verify exact clean install
        run: npm ci --no-audit --no-fund
      - name: Verify production advisory gate
        run: npm audit --omit=dev --audit-level=high
      - name: Commit patched lockfile to isolated branch
        run: |
          set -euo pipefail
          test -s package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --staged --quiet && exit 0
          git commit -m "security: lock patched PostCSS dependency graph"
          git push origin HEAD:refs/heads/infra/reproducible-deps-20261028
