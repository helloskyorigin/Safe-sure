name: Secuvora quality checks
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Bun (committed bun.lock)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies (locked)
        run: bun install --frozen-lockfile
      - name: Audit production dependency vulnerabilities
        run: bun audit --prod --audit-level=high
      - name: Type-check
        run: bun run typecheck
      - name: Build Next.js
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install Chromium for browser smoke tests
        run: bunx playwright install --with-deps chromium
      - name: Verify all product, legal, mobile and desktop routes
        run: bun run test:e2e
      - name: Keep responsive QA screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: secuvora-responsive-qa
          path: test-results/ux-snapshots/
          if-no-files-found: ignore
          retention-days: 3
