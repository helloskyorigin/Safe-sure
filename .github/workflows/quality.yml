name: ShipSafe quality checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium
      - name: Verify homepage scroll and mobile navigation
        run: npm run test:e2e
        env:
          RUN_LIVE_SCAN: '1'
